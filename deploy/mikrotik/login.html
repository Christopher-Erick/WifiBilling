<!DOCTYPE html>
<html>
<head>
  <title>LipaWiFi</title>
  <meta http-equiv="refresh" content="0; url=https://WIFI_PORTAL_HOST/portal?$(if chap-id)chap-id=$(chap-id)&chap-challenge=$(chap-challenge)&$(endif)mac=$(mac)&ip=$(ip)&username=$(username)&link-login=$(link-login)&link-login-only=$(link-login-only)&link-orig=$(link-orig)&link-orig-esc=$(link-orig-esc)&error=$(error)&dst=$(link-orig)&server=$(server)&identity=$(identity)&mac-esc=$(mac-esc)">
</head>
<body>
  <p>Redirecting to LipaWiFi…</p>
  <form method="get" action="https://WIFI_PORTAL_HOST/portal">
    <input type="hidden" name="mac" value="$(mac)">
    <input type="hidden" name="ip" value="$(ip)">
    <input type="hidden" name="username" value="$(username)">
    <input type="hidden" name="link-login" value="$(link-login)">
    <input type="hidden" name="link-login-only" value="$(link-login-only)">
    <input type="hidden" name="link-orig" value="$(link-orig)">
    <input type="hidden" name="chap-id" value="$(chap-id)">
    <input type="hidden" name="chap-challenge" value="$(chap-challenge)">
    <input type="hidden" name="error" value="$(error)">
    <input type="hidden" name="dst" value="$(link-orig)">
    <input type="hidden" name="server" value="$(server)">
    <input type="hidden" name="identity" value="$(identity)">
    <input type="submit" value="Continue">
  </form>
</body>
</html>
