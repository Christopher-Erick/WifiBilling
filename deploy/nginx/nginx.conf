worker_processes auto;
events { worker_connections 1024; }
http {
  map $http_x_request_id $rid {
    default $http_x_request_id;
    "" $request_id;
  }
  map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header X-Request-Id $rid always;
  server_tokens off;
  client_max_body_size 1m;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  # Docker embedded DNS. Re-resolve `app` so recreate does not stick to a stale IP (502).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Optional Cloudflare authentic origin. Uncomment after locking the origin to Cloudflare IPs
  # (see docs/cloudflare.md). Do not enable if the origin is reachable on the public internet.
  # include /etc/nginx/cloudflare-realip.conf;

  server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      set $upstream http://app:43127;
      proxy_pass $upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_set_header X-Request-Id $rid;
    }
  }
}
