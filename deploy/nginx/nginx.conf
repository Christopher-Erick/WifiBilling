worker_processes auto;
events { worker_connections 1024; }
http {
  # Docker embedded DNS. Re-resolve `app` so recreating the app container
  # does not leave nginx holding a stale IP (502).
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_x_request_id $rid {
    default $http_x_request_id;
    "" $request_id;
  }
  map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header X-Request-Id $rid always;
  server_tokens off;
  client_max_body_size 1m;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  server {
    listen 43127;
    server_name _;

    location /api/v1/public/health {
      set $upstream_app http://app:43127;
      proxy_pass $upstream_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_set_header X-Request-Id $rid;
    }

    location /api/v1/public/ready {
      set $upstream_app http://app:43127;
      proxy_pass $upstream_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_set_header X-Request-Id $rid;
    }

    location / {
      set $upstream_app http://app:43127;
      proxy_pass $upstream_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_set_header X-Request-Id $rid;
    }
  }
}
