# Local / demo overlay: mock M-Pesa allowed.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile seed up --build
#
# Set LIPAWIFI_HTTP_PORT=43127 in .env so the portal is not on :80.
services:
  app:
    environment:
      NODE_ENV: development
      MPESA_PROVIDER: mock
      TRUST_PROXY: nginx
      APP_URL: ${APP_URL:-http://127.0.0.1:43127}
  worker:
    environment:
      NODE_ENV: development
      MPESA_PROVIDER: mock
  scheduler:
    environment:
      NODE_ENV: development
      MPESA_PROVIDER: mock
