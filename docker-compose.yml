services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lipawifi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lipawifi_dev}
      POSTGRES_DB: lipawifi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lipawifi -d lipawifi"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://lipawifi:${POSTGRES_PASSWORD:-lipawifi_dev}@db:5432/lipawifi?schema=public
      REDIS_URL: redis://redis:6379
    command: ["/app/node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    build: .
    profiles: ["seed"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://lipawifi:${POSTGRES_PASSWORD:-lipawifi_dev}@db:5432/lipawifi?schema=public
      REDIS_URL: redis://redis:6379
    command: ["/app/node_modules/.bin/tsx", "prisma/seed.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  app:
    build: .
    env_file: .env
    environment:
      PORT: 43127
      HOSTNAME: 0.0.0.0
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://lipawifi:${POSTGRES_PASSWORD:-lipawifi_dev}@db:5432/lipawifi?schema=public
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: ${TRUST_PROXY:-nginx}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "43127"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:43127/api/v1/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://lipawifi:${POSTGRES_PASSWORD:-lipawifi_dev}@db:5432/lipawifi?schema=public
      REDIS_URL: redis://redis:6379
    command: ["/app/node_modules/.bin/tsx", "src/jobs/worker.ts"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    build: .
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://lipawifi:${POSTGRES_PASSWORD:-lipawifi_dev}@db:5432/lipawifi?schema=public
      REDIS_URL: redis://redis:6379
    command: ["/app/node_modules/.bin/tsx", "src/jobs/scheduler.ts"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  freeradius:
    build: ./deploy/freeradius
    environment:
      RADIUS_DB_HOST: db
      RADIUS_DB_PORT: "5432"
      RADIUS_DB_NAME: lipawifi
      RADIUS_DB_USER: lipawifi
      RADIUS_DB_PASSWORD: ${POSTGRES_PASSWORD:-lipawifi_dev}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    healthcheck:
      test: ["CMD-SHELL", "pidof radiusd || pidof freeradius || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  nginx:
    build: ./deploy/nginx
    environment:
      APP_HOSTNAME: ${APP_HOSTNAME:-localhost}
    ports:
      - "${LIPAWIFI_HTTP_PORT:-80}:80"
      - "${LIPAWIFI_HTTPS_PORT:-443}:443"
    volumes:
      - nginxcerts:/etc/nginx/certs
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/v1/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    restart: unless-stopped

  # Optional: docker compose --profile cloudflare up -d
  # Requires CLOUDFLARE_TUNNEL_TOKEN in .env (named tunnel, public HTTPS hostname).
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  nginxcerts:
